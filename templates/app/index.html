<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My app</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.mjs"></script></head>
<body><header><h1 id="app-title">My app</h1></header><main>
<section aria-labelledby="items-title"><h2 id="items-title">Items</h2><p id="status" role="status" aria-live="polite">Opening saved items…</p><ul id="items"></ul><button id="retry" type="button" hidden>Retry loading</button></section>
<form id="add-form"><label for="title">New item</label><input id="title" required maxlength="300" autocomplete="off"><button id="save" type="submit" disabled>Add item</button></form>
</main></body></html>
